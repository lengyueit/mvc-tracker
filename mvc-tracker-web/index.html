<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MVC Research Tracker</title>
    <meta name="description" content="Multi-view clustering research tracker with daily paper synchronization." />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Multi-view Clustering Watch</p>
        <h1>MVC 研究动态追踪</h1>
      </div>
      <div class="sync-card" id="syncCard">
        <span>同步状态</span>
        <strong>读取中</strong>
      </div>
    </header>

    <main>
      <section class="summary-grid" aria-label="summary">
        <div class="metric">
          <span>论文总数</span>
          <strong id="totalPapers">0</strong>
        </div>
        <div class="metric">
          <span>近 30 天新增</span>
          <strong id="recentPapers">0</strong>
        </div>
        <div class="metric">
          <span>追踪团队</span>
          <strong id="totalGroups">0</strong>
        </div>
        <div class="metric">
          <span>高相关论文</span>
          <strong id="highScorePapers">0</strong>
        </div>
      </section>

      <section class="workspace">
        <aside class="filters" aria-label="filters">
          <label>
            搜索
            <input id="searchInput" type="search" placeholder="标题、作者、venue、topic" />
          </label>

          <label>
            团队
            <select id="teamSelect">
              <option value="all">全部团队</option>
            </select>
          </label>

          <label>
            方向
            <select id="topicSelect">
              <option value="all">全部方向</option>
            </select>
          </label>

          <label>
            年份
            <select id="yearSelect">
              <option value="all">全部年份</option>
            </select>
          </label>

          <label>
            状态
            <select id="statusSelect">
              <option value="all">全部状态</option>
              <option value="new">new</option>
              <option value="reading">reading</option>
              <option value="important">important</option>
              <option value="done">done</option>
              <option value="skip">skip</option>
            </select>
          </label>

          <div class="sort-group" role="group" aria-label="sort">
            <button class="chip active" data-sort="date">按时间</button>
            <button class="chip" data-sort="score">按相关度</button>
          </div>
        </aside>

        <section class="paper-panel">
          <div class="panel-head">
            <div>
              <h2>最新论文</h2>
              <p id="resultCount">0 篇匹配</p>
            </div>
            <button id="exportButton" class="secondary">导出当前列表</button>
          </div>
          <div id="paperList" class="paper-list" aria-live="polite"></div>
        </section>
      </section>

      <section class="groups-section">
        <div class="panel-head">
          <div>
            <h2>追踪团队</h2>
            <p>团队信息在 <code>data/groups.json</code> 中维护，补全 author ID 后同步精度会更高。</p>
          </div>
        </div>
        <div id="groupList" class="group-list"></div>
      </section>
    </main>

    <script src="./assets/app.js" type="module"></script>
  </body>
</html>
